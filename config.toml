# ---- 숙제 구간 ---------------------------------------------------------------
# 캐릭터마다 구간(label)을 정하면 그 구간의 레이드가 그 캐릭터의 주간 숙제가 된다.
# raids   : 골드를 받는 레이드 (최대 3개)
# no_gold : 골드 없이 추가로 도는 레이드 (선택)
# auto    : 구간을 따로 안 정한 캐릭터는 auto = true 인 구간 중 아이템 레벨에 맞는 가장 높은 구간을 쓴다
# min_level 은 그 구간의 레이드를 모두 들어갈 수 있는 레벨이어야 한다.
# 공대 시트 '레이드 숙제' 아래 표를 옮긴 것. 구간을 더 만들거나 고쳐도 된다 (/레이드 새로고침 으로 반영)

