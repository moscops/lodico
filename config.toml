# 게임 규칙 값. 패치로 바뀔 수 있으니 업데이트 때마다 확인하세요.
# 봇을 재시작하면 반영됩니다.
# 기준: 2026-09 (벨가르딘 출시 이후). 출처: 로아로골 주간 골드 계산기, 나무위키, 인벤

[game]
# 주간 리셋: 수요일(2 = 월0 기준) 06:00 KST
reset_weekday = 2
reset_hour = 6
# 아래 레이드 값을 마지막으로 확인한 날짜. 값을 고치면 같이 바꿔 주세요 (/레이드 목록 에 표시됨)
data_updated = "2026-09-29"
# 원정대에서 골드를 받는 캐릭터 수 (아이템 레벨 상위 N개 자동 지정)
gold_characters = 6
# 캐릭터 하나가 골드를 받을 수 있는 주간 레이드 수
gold_raids_per_character = 3
# 서포터 직업 (파티 4명마다 1명). 줄임말로 등록한 캐릭터도 알아보도록 줄임말도 같이 적는다
support_classes = ["바드", "홀리나이트", "홀나", "도화가", "도화", "발키리", "발키"]

[defaults]
# 서버별 /봇설정 으로 덮어쓸 수 있는 기본값
morning_time = "09:00"
reminder_minutes = 30
# 일정을 만들 때 시각을 비우면 쓰는 기본 시작 시각 (나중에 /일정수정 으로 바꾸세요)
default_start = "21:00"
# 레이드에 duration_minutes 가 없을 때 쓰는 예상 소요 시간 (시간 겹침 판단용)
raid_duration_minutes = 60

[lostark_api]
# 공식 API 키는 .env 의 LOSTARK_API_KEY 에 넣으세요. 없으면 자동 갱신 기능이 꺼집니다.
# /원정대연동 한 공대원의 아이템 레벨을 몇 시간마다 자동 갱신할지
sync_interval_hours = 6
# 자동 갱신 때 원정대에 새로 입장 레벨(가장 낮은 레이드 기준)을 넘긴 캐릭터를 자동 추가할지
auto_add_new = true

# key       : 명령어와 DB에 쓰이는 고유값 (한 번 정하면 바꾸지 마세요)
# group     : 같은 레이드의 난이도 묶음. 같은 group 은 캐릭터당 주 1회 (난이도 중 하나만)
# name      : 표시 이름
# party_size: 4, 8, 16
# min_item_level: 입장 레벨
# gold      : 클리어 골드 합계 (전 관문, 더보기 제외)
# bound_gold: 그중 귀속 골드. 골드가 같으면 거래 가능 골드가 많은 쪽을 우선 추천
# more_cost : 전 관문 더보기 비용 합. 귀속 골드가 있는 레이드는 귀속에서, 없으면 거래 가능 골드에서 빠진다
#
# ※ 카제로스 1막/2막 익스트림은 기간 한정 콘텐츠라 넣지 않았습니다. 필요하면 추가하세요.

